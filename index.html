<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday, Mom! ❤️ | Special Surprise</title>
    <meta name="description" content="A magical and heartfelt birthday surprise website dedicated to my loving mom with celebrations, music, and love.">
    <meta name="theme-color" content="#fff8f0">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/base.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/scenes.css"
    >

</head>


<body>


    <!-- ======================================
         MAIN APPLICATION
         ====================================== -->

    <main id="app">

        <!-- Scenes will be inserted here
             by JavaScript -->

    </main>


    <!-- JavaScript -->

    <script src="js/config.js"></script>

    <script src="js/animations.js"></script>

    <script src="js/particles.js"></script>

    <script src="js/sceneManager.js"></script>

    <script src="js/typewriter.js"></script>

    <script src="js/gallery.js"></script>

    <script src="js/music.js"></script>

    <script src="js/app.js"></script>

    <audio
        id="background-music"
        loop
        preload="auto">
        <source src="music/birthday-special.mp3" type="audio/mpeg">
        <source src="music/birthday-special.mpeg" type="audio/mpeg">
    </audio>

    <button
        id="music-toggle"
        class="music-toggle"
        aria-label="Toggle music"
    >
        🔇
    </button>
</body>

</html>
